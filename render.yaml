services:
  - type: web
    name: vinicius-worldbank-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: vinicius-worldbank-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && VITE_API_BASE_URL="$BACKEND_URL" npm run build
    staticPublishPath: dist
    envVars:
      - key: BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
